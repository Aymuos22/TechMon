<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img">
  <title>Java</title>
  <!-- Recognizable coffee-cup mark (not OpenJDK) -->
  <rect width="24" height="24" rx="3" fill="#5382A1"/>
  <!-- steam -->
  <path fill="none" stroke="#E76F00" stroke-width="1.35" stroke-linecap="round" d="M9.2 5.2c.6-.7 1.1-.7 1.7 0 .6.7 1.1.7 1.7 0"/>
  <path fill="none" stroke="#E76F00" stroke-width="1.35" stroke-linecap="round" d="M10.2 3.4c.55-.65 1-.65 1.55 0"/>
  <!-- cup body -->
  <path fill="#fff" d="M7.2 8.4h8.2c.5 0 .9.4.9.9v5.2c0 2.1-1.7 3.8-3.8 3.8H10c-2.1 0-3.8-1.7-3.8-3.8V9.3c0-.5.4-.9.9-.9z"/>
  <!-- handle -->
  <path fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" d="M16.2 9.6h1.1c1.1 0 2 .9 2 2s-.9 2-2 2h-1.1"/>
  <!-- saucer -->
  <path fill="#E76F00" d="M6.4 18.6h11.2c.4 0 .7.3.7.7v.3H5.7v-.3c0-.4.3-.7.7-.7z"/>
  <!-- coffee surface -->
  <ellipse cx="12" cy="10.2" rx="3.4" ry="0.85" fill="#E76F00" opacity="0.85"/>
</svg>
